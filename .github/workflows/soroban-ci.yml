name: Soroban CI

on:
  push:
    branches: [development]
    paths:
      - "soroban-contracts/**"
      - ".github/workflows/soroban-ci.yml"
  pull_request:
    paths:
      - "soroban-contracts/**"
      - ".github/workflows/soroban-ci.yml"

defaults:
  run:
    working-directory: soroban-contracts

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: soroban-contracts
      - name: Clippy (warnings are errors)
        run: cargo clippy --workspace -- -D warnings
      - name: Tests
        run: cargo test --workspace
      - name: Optimized WASM build
        run: cargo build --workspace --release --target wasm32v1-none
