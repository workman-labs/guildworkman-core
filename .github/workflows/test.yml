name: Test

on:
  push:
    branches: [development]
    paths:
      - "backend-api/**"
      - ".github/workflows/test.yml"
  pull_request:
    paths:
      - "backend-api/**"
      - ".github/workflows/test.yml"

defaults:
  run:
    working-directory: backend-api

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: service
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      # `verify` runs the full test suite and then packages the application, so
      # a change that tests green but can't be built still fails the workflow.
      # Maven's dependency cache is handled by setup-java's `cache: maven`
      # above, keyed on pom.xml.
      - name: Build and test
        env:
          DATABASE_URL: jdbc:postgresql://localhost:5432/service
          DATABASE_USERNAME: postgres
          DATABASE_PASSWORD: password
        run: ./mvnw -B verify
