spring.application.name=guildworkman-api
spring.data.jdbc.dialect=postgresql
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# Every table/constraint in this app (including escrow_orchestration_requests
# and on_chain_events) is schema-managed this way — there is no Flyway/
# Liquibase here. `update` creates missing tables/constraints on startup and
# never drops or destructively alters existing columns, but it also can't
# express a safe rename or type change; those still need a hand-written
# ALTER TABLE. Production environments that want migration-tracked, reviewable
# schema changes should consider introducing Flyway/Liquibase — that's a
# cross-cutting change affecting every table, not specific to any one feature.
# See backend-api/docs/ESCROW_ORCHESTRATION.md ("Schema / migrations") for
# more detail.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/service}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:password}

# Transactional email (Brevo/Sendinblue)
mail.api.key=${MAIL_API_KEY:}
mail.api.url=${MAIL_API_URL:https://api.brevo.com/v3/smtp/email}

# Cloudinary media uploads
cloud.api.name=${CLOUDINARY_API_NAME:}
cloud.api.key=${CLOUDINARY_API_KEY:}
cloud.api.secret=${CLOUDINARY_API_SECRET:}

# Paystack payments (legacy PaymentServiceImpl -- see backend-api/docs/PAYMENTS_LEDGER.md)
paystack.secret.key=${PAYSTACK_SECRET_KEY:}
paystack.verify.payment.url=${PAYSTACK_VERIFY_URL:https://api.paystack.co/transaction/verify}
paystack.initiate.payment=${PAYSTACK_INITIATE_URL:https://api.paystack.co/transaction/initialize}

# Payments ledger: how the ledger reaches Paystack, and the secret that both
# signs outbound calls and verifies inbound webhooks. Defaults from the same
# PAYSTACK_SECRET_KEY as above so there is one place to set it.
#
# An empty secret means every webhook is REJECTED, not accepted: an
# unconfigured deployment fails closed. Local development and CI set a test
# secret rather than relying on verification being skipped.
payments.paystack.base-url=${PAYSTACK_BASE_URL:https://api.paystack.co}
payments.paystack.secret-key=${PAYSTACK_SECRET_KEY:}
payments.paystack.request-timeout=${PAYSTACK_REQUEST_TIMEOUT:PT10S}

# The platform's commission, in basis points of the captured amount
# (250 = 2.5%). Basis points, not a percentage, so the fee is computed with
# integer arithmetic end to end and cannot introduce a rounding drift the
# ledger has no way to account for.
payments.platform-fee-bps=${PAYMENTS_PLATFORM_FEE_BPS:250}
payments.default-currency=${PAYMENTS_DEFAULT_CURRENCY:NGN}

# Reconciliation: how long a payment is left alone before the sweep asks the
# provider about it (the client's window to finish checkout), how many are
# examined per sweep, and how often the sweep runs. Set the delay to a large
# value to effectively disable the scheduler in a batch/replay job.
#
# poll-delay-ms sits outside PaymentProperties on purpose, the same way
# booking.expiry-sweep-delay-ms does: @Scheduled reads it as a raw placeholder
# at bean-creation time, not through a bound properties object.
payments.reconciliation-grace=${PAYMENTS_RECONCILIATION_GRACE:PT15M}
payments.reconciliation-batch-size=${PAYMENTS_RECONCILIATION_BATCH_SIZE:50}
payments.reconciliation.poll-delay-ms=${PAYMENTS_RECONCILIATION_POLL_DELAY_MS:60000}

spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}

# Renders framework-level exceptions we don't explicitly handle in
# GlobalExceptionHandler (e.g. unsupported media type, 404 on unmapped routes)
# as RFC 7807 (application/problem+json) too, for a consistent error contract.
spring.mvc.problemdetails.enabled=true

# Base URI for the RFC 7807 problem `type` field. Override per-environment so
# staging/prod can point at their own canonical docs host.
guildworkman.problem-details.type-base=${PROBLEM_TYPE_BASE:https://guildworkman.dev/problems/}

# On-chain ingestion worker. Set to 0 to disable polling in a batch/replay job.
chain.events.poll-delay-ms=${CHAIN_EVENTS_POLL_DELAY_MS:1000}

# Escrow orchestration: Soroban RPC endpoint used to submit/poll escrow
# contract transactions. Callers build and sign transactions client-side;
# this service only relays the signed XDR and tracks its outcome.
soroban.rpc.url=${SOROBAN_RPC_URL:https://soroban-testnet.stellar.org}
soroban.rpc.request-timeout=${SOROBAN_RPC_TIMEOUT:PT10S}

# How often the orchestration workers poll for PENDING/SUBMITTED requests.
escrow.orchestration.submit-poll-delay-ms=${ESCROW_SUBMIT_POLL_DELAY_MS:1000}
escrow.orchestration.confirm-poll-delay-ms=${ESCROW_CONFIRM_POLL_DELAY_MS:1000}

# Retry/backoff for both the submit and confirm loops. Backoff doubles from
# base-delay each attempt, capped at max-delay, then randomized by +/- jitter
# (a fraction of the computed delay) so retries don't all land in lockstep.
escrow.orchestration.retry.max-attempts=${ESCROW_RETRY_MAX_ATTEMPTS:5}
escrow.orchestration.retry.base-delay=${ESCROW_RETRY_BASE_DELAY:PT1S}
escrow.orchestration.retry.max-delay=${ESCROW_RETRY_MAX_DELAY:PT64S}
escrow.orchestration.retry.jitter=${ESCROW_RETRY_JITTER:0.2}

# Reconciliation: how long a CONFIRMED request may go without a corroborating
# ingested on-chain event before it's flagged MISMATCHED, and how often the
# reconciliation sweep runs.
escrow.reconciliation.window=${ESCROW_RECONCILIATION_WINDOW:PT10M}
escrow.reconciliation.poll-delay-ms=${ESCROW_RECONCILIATION_POLL_DELAY_MS:5000}

# Concurrency-safe booking / slot reservation.
#   - hold-ttl: how long an unconfirmed hold keeps a slot. 5 minutes matches the
#     TTL the guildworkman-web booking calendar already used client-side.
#   - slot-duration: default slot length, and the length assumed for legacy
#     appointments (which store only a start time).
#   - max-slot-duration / max-availability-window: bounds so one request can't
#     block a whole calendar or ask for an unbounded range.
booking.reservation.hold-ttl=${BOOKING_HOLD_TTL:PT5M}
booking.reservation.slot-duration=${BOOKING_SLOT_DURATION:PT1H}
booking.reservation.max-slot-duration=${BOOKING_MAX_SLOT_DURATION:PT12H}
booking.reservation.max-availability-window=${BOOKING_MAX_AVAILABILITY_WINDOW:P62D}
booking.reservation.expiry-sweep-batch-size=${BOOKING_EXPIRY_SWEEP_BATCH_SIZE:100}

# How often the background sweep reclaims holds nobody confirmed or released.
# Deliberately outside the booking.reservation.* prefix: @Scheduled reads it as
# a raw placeholder, not through SlotReservationProperties.
booking.expiry-sweep-delay-ms=${BOOKING_EXPIRY_SWEEP_DELAY_MS:30000}

# Stellar key custody & transaction signing.
#   - provider: `local` signs with seeds from configuration (development and
#     CI); `kms` delegates every signature to an external gateway and never
#     sees a secret key. Only one provider bean exists at a time.
#   - network-passphrase: the hash a signature commits to includes this, so it
#     must describe the same network SOROBAN_RPC_URL points at. Signing for
#     the wrong network yields signatures that are valid nowhere.
#   - fee-source-key-ref: key that pays for fee bumps. Empty means the channel
#     account pays for its own bump, which is always valid.
#   - enabled: the rollback lever. `false` stops signing, broadcasting and
#     polling; the API keeps accepting submissions and they queue as PENDING
#     until it is turned back on. Every phase transition is already durable, so
#     pausing and resuming is safe at any point. See docs/STELLAR_SIGNING.md
#     ("Operator runbook").
# These values are validated at startup (SigningProperties#validate) — a fee
# ceiling below the base fee, or a bump multiplier of 1.0, fails the boot
# rather than every transaction.
stellar.signing.enabled=${STELLAR_SIGNING_ENABLED:true}
stellar.signing.provider=${STELLAR_SIGNING_PROVIDER:local}
stellar.signing.network-passphrase=${STELLAR_NETWORK_PASSPHRASE:Test SDF Network ; September 2015}
stellar.signing.fee-source-key-ref=${STELLAR_FEE_SOURCE_KEY_REF:}

# Local (development) custody. Seeds are supplied per key reference through the
# environment and MUST NOT be committed:
#   STELLAR_LOCAL_KEYS_CHANNEL1=SB...  ->  stellar.signing.local.keys.channel1
# Deliberately no default: a missing seed is a startup-time failure to sign,
# which is a far better outcome than a shared key baked into the repository.
# The `kms` provider needs no key configuration at all — only a gateway.
stellar.signing.kms.url=${STELLAR_KMS_URL:}
stellar.signing.kms.api-key=${STELLAR_KMS_API_KEY:}
stellar.signing.kms.request-timeout=${STELLAR_KMS_TIMEOUT:PT5S}

# Time bound written into every built transaction, and how long a broadcast
# transaction may stay unconfirmed before it's treated as stuck behind a low
# fee and bumped. stall-after must be comfortably under transaction-timeout,
# or the transaction expires before a bump can help it.
stellar.signing.transaction-timeout=${STELLAR_TRANSACTION_TIMEOUT:PT120S}
stellar.signing.stall-after=${STELLAR_STALL_AFTER:PT30S}

# How long a channel-account lease survives without progress before the
# sweeper reclaims it. This is the crash-recovery bound: a process that dies
# mid-submission holds its account for at most this long.
stellar.signing.lease-ttl=${STELLAR_LEASE_TTL:PT5M}
stellar.signing.lease-sweep-delay-ms=${STELLAR_LEASE_SWEEP_DELAY_MS:30000}

# Fee policy in stroops (1 XLM = 10,000,000 stroops). Each bump multiplies the
# current fee by bump-multiplier; the first bump that would exceed
# max-total-stroops fails the submission terminally instead. This ceiling is
# what stops a congested network turning a retry loop into unbounded spend.
stellar.signing.fee.base-stroops=${STELLAR_FEE_BASE_STROOPS:100}
stellar.signing.fee.max-total-stroops=${STELLAR_FEE_MAX_TOTAL_STROOPS:1000000}
stellar.signing.fee.bump-multiplier=${STELLAR_FEE_BUMP_MULTIPLIER:2.0}

# Retry/backoff for retryable submission failures, same shape as
# escrow.orchestration.retry.*. Exhausting max-attempts dead-letters the
# submission rather than retrying forever.
stellar.signing.retry.max-attempts=${STELLAR_RETRY_MAX_ATTEMPTS:5}
stellar.signing.retry.base-delay=${STELLAR_RETRY_BASE_DELAY:PT1S}
stellar.signing.retry.max-delay=${STELLAR_RETRY_MAX_DELAY:PT64S}
stellar.signing.retry.jitter=${STELLAR_RETRY_JITTER:0.2}

# How often each stage of the submission pipeline polls for work. Read by
# @Scheduled as raw placeholders, hence outside the bound *.retry/*.fee groups.
stellar.signing.prepare-poll-delay-ms=${STELLAR_PREPARE_POLL_DELAY_MS:1000}
stellar.signing.broadcast-poll-delay-ms=${STELLAR_BROADCAST_POLL_DELAY_MS:1000}
stellar.signing.confirm-poll-delay-ms=${STELLAR_CONFIRM_POLL_DELAY_MS:1000}

# JWT authentication.
#   - secret: HMAC-256 signing key. MUST be overridden in every real
#     environment via JWT_SECRET (>= 32 bytes). The baked-in default exists
#     only so local dev and CI boot without extra setup — it is not a secret.
#   - access-token-ttl: short-lived bearer token (default 15 min).
#   - refresh-token-ttl: opaque rotating refresh token (default 7 days).
security.jwt.secret=${JWT_SECRET:dev-only-insecure-secret-change-me-please-32b}
security.jwt.issuer=${JWT_ISSUER:guildworkman-api}
security.jwt.access-token-ttl=${JWT_ACCESS_TTL:PT15M}
security.jwt.refresh-token-ttl=${JWT_REFRESH_TTL:P7D}

# CORS — comma-separated origins (patterns allowed, e.g. https://*.vercel.app
# for preview deployments). Configured in config/WebConfig; the default covers
# local development and the live frontend (guildworkman-web.vercel.app).
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,https://guildworkman-web.vercel.app}

# Hard cap on the page size any Pageable-bound endpoint accepts (currently
# only GET /api/v1/notifications), regardless of what a caller passes as
# ?size=. Spring Data's own default (2000) is too high to call "sane" for a
# public-facing list endpoint; NotificationController's own @PageableDefault
# (20) only sets what happens when size is omitted, it doesn't bound it.
spring.data.web.pageable.max-page-size=${PAGEABLE_MAX_PAGE_SIZE:100}
# --- Metrics ---------------------------------------------------------------
# Micrometer counters for the signing pipeline (see signing/service/SigningMetrics)
# are scraped from /actuator/prometheus. Only health, info and prometheus are
# exposed, and none of them is in SecurityConfig's PUBLIC_ENDPOINTS, so a
# scraper needs a bearer token or in-cluster network policy — deliberately, as
# the metric tags name failure reasons and pipeline phases.
management.endpoints.web.exposure.include=${MANAGEMENT_ENDPOINTS:health,info,prometheus}
management.endpoint.health.show-details=when-authorized

# --- Worker discovery -----------------------------------------------------
# GET /api/v1/discovery/workers. Full design: backend-api/docs/WORKER_DISCOVERY.md
guildworkman.discovery.default-radius-km=${DISCOVERY_DEFAULT_RADIUS_KM:10}
guildworkman.discovery.max-radius-km=${DISCOVERY_MAX_RADIUS_KM:50}
guildworkman.discovery.default-page-size=${DISCOVERY_DEFAULT_PAGE_SIZE:20}
guildworkman.discovery.max-page-size=${DISCOVERY_MAX_PAGE_SIZE:50}
guildworkman.discovery.max-skill-facets=${DISCOVERY_MAX_SKILL_FACETS:25}

# Ranking blend. Weights need not sum to 1 -- the score is normalised by their
# total, so retuning them keeps rankScore in [0,1]. Defaults: proximity leads,
# then reputation, then availability.
guildworkman.discovery.ranking.proximity-weight=${DISCOVERY_RANK_PROXIMITY:0.5}
guildworkman.discovery.ranking.reputation-weight=${DISCOVERY_RANK_REPUTATION:0.3}
guildworkman.discovery.ranking.availability-weight=${DISCOVERY_RANK_AVAILABILITY:0.2}

# On-chain reputation is materialised into worker_reputation_snapshots by a
# background refresher and never read on the search request path. The refresher
# calls a read-model / indexer that projects the reputation contract's Rating
# aggregate (same decision as EscrowReconciliationService: consume a projection,
# don't hand-encode Soroban XDR).
guildworkman.discovery.reputation.read-model-url=${REPUTATION_READ_MODEL_URL:http://localhost:8081}
guildworkman.discovery.reputation.request-timeout=${REPUTATION_READ_TIMEOUT:PT5S}
# A snapshot older than this is refreshed; also the bound on how stale a
# worker's reputation contribution to ranking can be, and the window in which
# ranking stays stable across a paginated scroll.
guildworkman.discovery.reputation.staleness-bound=${REPUTATION_STALENESS_BOUND:PT15M}
# Neutral score for an unrated worker, or when the read-model is unavailable and
# the worker has no prior snapshot.
guildworkman.discovery.reputation.fallback-score=${REPUTATION_FALLBACK_SCORE:0.5}
guildworkman.discovery.reputation.shrink-k=${REPUTATION_SHRINK_K:5}
guildworkman.discovery.reputation.refresh-batch-size=${REPUTATION_REFRESH_BATCH_SIZE:100}
# Read by @Scheduled as a raw placeholder, hence outside the bound group. Set
# high in tests so the poller doesn't race the shared DB (see pom.xml surefire
# notes and the other *.poll-delay-ms entries above).
guildworkman.discovery.reputation.poll-delay-ms=${REPUTATION_REFRESH_POLL_DELAY_MS:60000}
